# Render Blueprint: New -> Blueprint -> this repo. Creates the web service (built from the Dockerfile) and a free
# PostgreSQL database, and wires them together. Render asks for ADMIN_EMAIL and ADMIN_PASSWORD once.
services:
  - type: web
    name: docsearch
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: docsearch-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: docsearch-db
    plan: free
    databaseName: docsearch
    user: docsearch
